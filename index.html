<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for you</title>
<style>
:root{--ink:#161320;--wax:#8c1d2f;--waxhi:#b32a40;--paper:#f4ecdc;--text:#2b2230;--gold:#d9b66f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 30%,#2a1f3a,var(--ink) 70%);color:var(--paper);font-family:Georgia,"Palatino Linotype",serif;display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
main{width:100%;max-width:560px;text-align:center}
h1{font-weight:400;font-size:1.5rem;letter-spacing:.02em;margin:8px 0 28px}
.envelope{position:relative;width:100%;aspect-ratio:3/2;background:#e6d8bd;border-radius:6px;box-shadow:0 20px 50px #0008;cursor:pointer;margin:0 auto 24px;transition:transform .4s}
.envelope:hover{transform:translateY(-3px)}
.envelope::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,#cdbb99 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,#d6c5a3 50%) right/50% 100% no-repeat;border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:#d8c8a6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease}
.envelope.open .flap{transform:rotateX(180deg);background:#cbb994}
.seal{position:absolute;left:50%;top:58%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--waxhi),var(--wax));box-shadow:0 4px 10px #0006;display:grid;place-items:center;font-size:1.6rem;color:#e9b7bf;transition:opacity .4s,transform .4s}
.envelope.open .seal{opacity:0;transform:scale(.4)}
.hint{opacity:.7;font-size:.95rem;font-style:italic}
.card{background:var(--paper);color:var(--text);border-radius:8px;padding:28px 24px;box-shadow:0 20px 50px #0008;text-align:left}
.card p.q{font-size:1.25rem;line-height:1.5;margin:0 0 18px}
.row{display:flex;gap:10px}
input{flex:1;font:inherit;padding:12px 14px;border:1.5px solid #b9a98a;border-radius:6px;background:#fffaf0;color:var(--text);min-width:0}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;padding:12px 20px;border:0;border-radius:6px;background:var(--wax);color:#fff;cursor:pointer}
button:hover{background:var(--waxhi)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:#fffaf0;color:var(--text);border:1.5px solid #b9a98a;padding:14px 16px;font-size:1.05rem}
.opt:hover{background:#f3e6cc}
.opt.bad{background:#f1d4d8;border-color:var(--wax);color:var(--wax);cursor:not-allowed}
.opt.good{background:#d9ecd4;border-color:#3f7a3a;color:#25521f}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.95rem;color:var(--wax)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.words{display:flex;justify-content:center;gap:.5em;flex-wrap:wrap;font-size:2.6rem;margin:0 0 26px;min-height:1.3em}
.words span{color:var(--gold);animation:pop .7s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.letter{background:var(--paper);color:var(--text);padding:36px 28px;border-radius:4px;text-align:left;line-height:1.8;font-size:1.1rem;box-shadow:0 20px 50px #0008;animation:rise 1.2s ease both}
.letter p{margin:0 0 1.1em;overflow-wrap:anywhere}
.letter .to{font-size:1.3rem}
.letter .from{margin-top:2em;font-style:italic}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="title">A letter is waiting for you</h1>
  <div class="words" id="words" aria-live="polite"></div>

  <div id="envWrap">
    <div class="envelope" id="env" role="button" tabindex="0" aria-label="Locked envelope">
      <div class="flap"></div><div class="seal">&#9825;</div>
    </div>
    <p class="hint" id="hint">This letter is locked. Answer 3 questions to open it.</p>
    <button id="begin">Begin</button>
  </div>

  <section class="card" id="card" hidden>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <p class="msg" id="msg"></p>
  </section>

  <article class="letter" id="letter" hidden></article>
</main>

/* ================ END OF EDITING ================== */

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let step = -1;
let unlocked = false;

function begin() {
  $("envWrap").hidden = true;
  $("title").textContent = "Three questions";
  step = 0;
  showQuestion();
}

function showQuestion() {
  const Q = QUESTIONS[step];
  $("card").hidden = false;
  $("q").textContent = Q.q;
  $("msg").textContent = "";
  const box = $("opts");
  box.innerHTML = "";
  shuffle([Q.correct, ...Q.others]).forEach(text => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = text;
    b.addEventListener("click", () => choose(b, text));
    box.appendChild(b);
  });
  box.firstChild.focus();
}

function choose(btn, text) {
  if (btn.classList.contains("bad") || $("opts").dataset.done) return;
  if (text !== QUESTIONS[step].correct) {
    btn.classList.add("bad");
    $("msg").textContent = QUESTIONS[step].wrong || "Not quite. Try another one.";
    $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake");
    return;
  }
  $("opts").dataset.done = "1";
  btn.classList.add("good");
  $("msg").textContent = "";
  const w = document.createElement("span");
  w.textContent = WORDS[step];
  $("words").appendChild(w);
  step++;
  setTimeout(() => {
    $("card").hidden = true;
    delete $("opts").dataset.done;
    step >= QUESTIONS.length ? backToEnvelope() : showQuestion();
  }, 900);
}

function backToEnvelope() {
  unlocked = true;
  $("title").textContent = "It's unlocked";
  $("hint").textContent = "Now you can open it. Tap the seal.";
  $("begin").hidden = true;
  $("env").setAttribute("aria-label", "Open the envelope");
  $("envWrap").hidden = false;
  $("env").focus();
}

function openEnvelope() {
  if (!unlocked) return;
  unlocked = false;
  $("env").classList.add("open");
  $("hint").hidden = true;
  setTimeout(() => { $("envWrap").hidden = true; showLetter(); }, 1000);
}

function showLetter() {
  $("title").textContent = "For you";
  const L = $("letter");
  L.innerHTML = "";
  if (HER_NAME) { const to = document.createElement("p"); to.className = "to"; to.textContent = "Dear " + HER_NAME + ","; L.appendChild(to); }
  LETTER.forEach(t => { const p = document.createElement("p"); p.textContent = t; L.appendChild(p); });
  const f = document.createElement("p"); f.className = "from"; f.textContent = "Forever yours, " + YOUR_NAME;
  L.appendChild(f);
  L.hidden = false;
  setTimeout(() => L.scrollIntoView({ behavior: "smooth", block: "start" }), 300);
}

$("begin").addEventListener("click", begin);
$("env").addEventListener("click", openEnvelope);
$("env").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); } });
</script>
</body>
</html>
